name: Coordinator Tests

on:
  pull_request:
    paths:
      - 'coordinator/**'
      - '.github/workflows/coordinator-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'coordinator/**'
      - '.github/workflows/coordinator-tests.yml'

permissions:
  contents: read

jobs:
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./coordinator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install Python bridge dependency
        run: python -m pip install pyyaml==6.0.3

      - name: Read executor Go toolchain
        id: go-toolchain
        run: |
          python -c 'from pathlib import Path; print("version=" + next(line.split()[1].removeprefix("go") for line in Path("../proxy/executor/go.mod").read_text().splitlines() if line.startswith("toolchain ")))' >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.go-toolchain.outputs.version }}
          cache-dependency-path: proxy/executor/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install pinned native OpenCode CLI
        run: |
          npm install --global --prefix "$RUNNER_TEMP/opencode" --no-package-lock @opencode/cli@2.1.2
          binary="$RUNNER_TEMP/opencode/bin/opencode"
          test -x "$binary"
          version="$("$binary" --version)"
          printf '%s\n' "$version"
          test "$version" = 'opencode v2.1.2'

      - name: Run native OpenCode suites and lifecycle
        env:
          REHOR_TEST_OPENCODE_BINARY: ${{ runner.temp }}/opencode/bin/opencode
        run: |
          test -x "$REHOR_TEST_OPENCODE_BINARY"
          test "$("$REHOR_TEST_OPENCODE_BINARY" --version)" = 'opencode v2.1.2'
          npm test -- test/*-native.test.ts test/runtime-opencode.test.ts --maxWorkers=1
