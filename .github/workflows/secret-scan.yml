name: Secret scan

# Runs on every PR and push to master with NO path filter — unlike the other
# CI workflows in this repo, secrets can be introduced in any file, so this
# check always fires and is eligible to be a hard-required branch protection
# check (see .github/branch-protection/required-checks.json).
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Installs the gitleaks OSS CLI (MIT-licensed) directly from a pinned,
      # checksum-verified release binary. We deliberately do NOT use the
      # gitleaks/gitleaks-action wrapper — it requires a paid GITLEAKS_LICENSE
      # for organization-owned repos (this one), while the underlying CLI is
      # free and unrestricted.
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          gitleaks git -v --redact --no-banner --config .gitleaks.toml .
