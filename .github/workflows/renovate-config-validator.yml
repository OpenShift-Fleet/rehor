# Never make this workflow a required status check. It only runs when
# renovate.jsonc changes; on any other PR GitHub keeps a skipped required
# check "Pending" forever, so every dependency PR would be blocked from merging.
name: Renovate Config Validator
on:
  pull_request:
    branches:
      - master
    paths:
      - renovate.jsonc
  push:
    branches:
      - master
    paths:
      - renovate.jsonc
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The same action MintMaker runs on its own repository. It checks syntax
      # and schema only: a rule that matches no file or package still passes.
      - uses: konflux-ci/renovate-config-validator-action@84178696a3dc01882f701fcbf0fa63d0bafb0a4b # main
        with:
          config_file: renovate.jsonc
          strict: true
