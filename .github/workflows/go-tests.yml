name: Go Tests

on:
  pull_request:
    paths:
      - 'proxy/executor/**.go'
      - 'proxy/executor/go.mod'
      - 'proxy/executor/go.sum'
      - '.github/workflows/go-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'proxy/executor/**.go'
      - 'proxy/executor/go.mod'
      - 'proxy/executor/go.sum'
      - '.github/workflows/go-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: proxy/executor/go.mod

      - name: Vet
        working-directory: proxy/executor
        run: go vet ./...

      - name: Run tests
        working-directory: proxy/executor
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic $(go list ./... | grep -v /gen | grep -v /cmd/server)

      - name: Check test coverage
        working-directory: proxy/executor
        run: |
          go tool cover -func=coverage.txt
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

      - name: Build binaries
        working-directory: proxy/executor
        run: |
          go build -v ./cmd/server
          go build -v ./cmd/client
