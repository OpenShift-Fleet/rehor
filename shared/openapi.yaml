openapi: 3.0.3
info:
  title: Dev Bot Memory Server API
  version: 0.1.0
  description: API for the Dev Bot memory server — tasks, memories, costs, cycle runs, and analytics.

servers:
  - url: /

paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: List tasks with optional filters
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: exclude_status
          in: query
          schema: { type: string }
        - name: instance_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Paginated list of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TaskItem'

  /api/task-outcomes/summary:
    get:
      operationId: getTaskOutcomeSummary
      summary: Get task outcome and repository rollups
      parameters:
        - name: from
          in: query
          description: Inclusive UTC YYYY-MM-DD filter on the latest outcome/report or lifecycle activity timestamp.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive UTC YYYY-MM-DD filter on the latest outcome/report or lifecycle activity timestamp.
          schema: { type: string, format: date }
        - name: repo
          in: query
          schema: { type: string }
        - name: category
          in: query
          description: Optional task category; omit to summarize all categories.
          schema: { type: string, enum: [delivery, monitoring, grooming] }
        - name: decision
          in: query
          schema: { type: string, enum: [accepted, rejected, obsolete, inconclusive, unreported, wip] }
        - name: confidence
          in: query
          schema: { type: string, enum: [conclusive, inconclusive] }
        - name: reason
          in: query
          schema: { type: string }
        - name: source
          in: query
          description: Evidence provider, matched case-insensitively.
          schema: { type: string }
      responses:
        '200':
          description: Holistic and per-repository outcome summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskOutcomeSummary' }
        '400':
          description: Invalid filter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/task-outcomes/tasks:
    get:
      operationId: listTaskOutcomes
      summary: List task outcomes with filters and stable offset pagination
      parameters:
        - name: repo
          in: query
          schema: { type: string }
        - name: category
          in: query
          description: Optional task category; omit to include delivery, monitoring, and grooming tasks.
          schema: { type: string, enum: [delivery, monitoring, grooming] }
        - name: decision
          in: query
          schema: { type: string, enum: [accepted, rejected, obsolete, inconclusive, unreported, wip] }
        - name: confidence
          in: query
          schema: { type: string, enum: [conclusive, inconclusive] }
        - name: reason
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Filtered task outcomes, newest activity first with task ID tie-break.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskOutcomePage' }
        '400':
          description: Invalid filter or pagination value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/task-outcomes/tasks/{task_id}:
    get:
      operationId: getTaskOutcomeDetail
      summary: Get full outcome report history and evidence for one task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Task lifecycle, current report, full append-only outcome history, artifacts, and evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskOutcomeTask' }
        '404':
          description: Task not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/tasks/{key}:
    delete:
      operationId: archiveTask
      summary: Archive (soft-delete) a task
      description: Requires a valid staged outcome report by default. Reported retries preserve the selected report and timestamps. Use manual=true only for explicit manual/dashboard archival, which clears the selected report pointer and remains unreported; report history is preserved.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: manual
          in: query
          required: false
          description: Explicit manual/dashboard archive without an outcome report.
          schema: { type: boolean, default: false }
        - name: source_type
          in: query
          required: false
          description: Task source identity. Omit only when the external key identifies exactly one task; ambiguous keys are rejected.
          schema: { type: string }
      responses:
        '200':
          description: Task archived
          content:
            application/json:
              schema:
                type: object
                required: [archived, external_key, task]
                properties:
                  archived: { type: boolean }
                  external_key: { type: string }
                  task: { $ref: '#/components/schemas/TaskItem' }
        '400':
          description: Invalid manual or source_type query parameter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Task not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Missing or invalid outcome report, or ambiguous task key. Error leads with recovery instructions visible in the first 200 response characters; detail, evidence schema guidance, external_key and source_type follow. Task remains unchanged.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      detail: { type: string }
                      evidence: { type: string }
                      external_key: { type: string }
                      source_type: { type: string, nullable: true }

  /api/tasks/{key}/pause:
    post:
      operationId: pauseTask
      summary: Pause a task
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paused_reason: { type: string, nullable: true }
      responses:
        '200':
          description: Task paused
          content:
            application/json:
              schema:
                type: object
                required: [paused, external_key, task]
                properties:
                  paused: { type: boolean }
                  external_key: { type: string }
                  task: { $ref: '#/components/schemas/TaskItem' }

  /api/tasks/{key}/unpause:
    post:
      operationId: unpauseTask
      summary: Unpause a task
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task unpaused
          content:
            application/json:
              schema:
                type: object
                required: [unpaused, external_key, task]
                properties:
                  unpaused: { type: boolean }
                  external_key: { type: string }
                  task: { $ref: '#/components/schemas/TaskItem' }
        '409':
          description: Too many active tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tasks/{key}/unarchive:
    post:
      operationId: unarchiveTask
      summary: Restore an archived task
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task unarchived
          content:
            application/json:
              schema:
                type: object
                required: [unarchived, external_key, task]
                properties:
                  unarchived: { type: boolean }
                  external_key: { type: string }
                  task: { $ref: '#/components/schemas/TaskItem' }

  /api/memories:
    get:
      operationId: listMemories
      summary: List memories with optional filters
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: repo
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Paginated list of memories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemoryItem'

  /api/memories/{id}:
    get:
      operationId: getMemory
      summary: Get a single memory by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Memory item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryItem'
    delete:
      operationId: deleteMemory
      summary: Delete a memory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Memory deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted: { type: boolean }
                  id: { type: integer }

  /api/memories/search:
    get:
      operationId: searchMemories
      summary: Search memories by similarity
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: repo
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Array of memory items with similarity scores
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MemoryItem'
                    - type: object
                      required: [similarity]
                      properties:
                        similarity: { type: number }

  /api/memories/upload:
    post:
      operationId: uploadMemories
      summary: Bulk upload memories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memories]
              properties:
                memories:
                  type: array
                  items: { type: object }
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                type: object
                required: [uploaded, errors]
                properties:
                  uploaded: { type: integer }
                  errors:
                    type: array
                    items: { type: string }

  /api/memories/embeddings:
    get:
      operationId: getEmbeddings
      summary: Get PCA-projected 3D embedding coordinates
      responses:
        '200':
          description: Array of embedding points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmbeddingPoint'

  /api/costs:
    get:
      operationId: listCosts
      summary: List cost entries with daily aggregates
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
        - name: days
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: instance_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Cost entries and daily aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostsResponse'
    post:
      operationId: addCostEntry
      summary: Record a new cost entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleEntryItem'
      responses:
        '201':
          description: Created cost entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleEntryItem'

  /api/cycle-runs:
    get:
      operationId: listCycleRuns
      summary: List cycle runs with optional filters
      parameters:
        - name: task_id
          in: query
          schema: { type: string }
        - name: instance_id
          in: query
          schema: { type: string }
        - name: cycle_type
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Paginated list of cycle runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CycleRunItem'
    post:
      operationId: addCycleRun
      summary: Record a new cycle run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created cycle run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleRunItem'

  /api/cycle-runs/by-task:
    get:
      operationId: listCycleRunsByTask
      summary: Cycle runs grouped by task
      parameters:
        - name: instance_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Task cycle groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskCycleGroup'

  /api/cycle-runs/{id}/transcript:
    get:
      operationId: getCycleRunTranscript
      summary: Get cycle run transcript (binary)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: decompress
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Raw transcript data
          content:
            application/zstd:
              schema:
                type: string
                format: binary
            application/x-ndjson:
              schema:
                type: string

  /api/bot-status:
    get:
      operationId: getBotStatus
      summary: Get current bot status
      responses:
        '200':
          description: Bot status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotStatus'
    post:
      operationId: updateBotStatus
      summary: Update bot status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string }
                message: { type: string }
                repo: { type: string }
                external_key: { type: string }
                source_type: { type: string }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /api/instances:
    get:
      operationId: listInstances
      summary: List bot instances
      responses:
        '200':
          description: Array of bot instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotInstance'

  /api/instances/{instance_id}:
    get:
      operationId: getInstance
      summary: Get a single bot instance
      parameters:
        - name: instance_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Bot instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotInstance'

  /api/instances/{instance_id}/idle:
    patch:
      operationId: updateInstanceIdle
      summary: Update idle tracking for an instance
      parameters:
        - name: instance_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idle_consecutive_cycles: { type: integer }
                last_idle_reminder_sent_at: { type: string, nullable: true }
      responses:
        '200':
          description: Updated instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotInstance'

  /api/analytics:
    get:
      operationId: getAnalytics
      summary: Get analytics summary
      parameters:
        - name: days
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: instance_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsData'

  /api/tags:
    get:
      operationId: listTags
      summary: List all memory tags
      responses:
        '200':
          description: Array of tag strings
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/stats:
    get:
      operationId: getStats
      summary: Get summary statistics
      responses:
        '200':
          description: Stats summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: object
                    additionalProperties: { type: integer }
                  memories:
                    type: object
                    properties:
                      total: { type: integer }
                      by_category:
                        type: object
                        additionalProperties: { type: integer }
                      by_repo:
                        type: object
                        additionalProperties: { type: integer }

  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    PaginatedResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
      additionalProperties: false

    TaskOutcomeReport:
      type: object
      required: [id, decision, confidence, reason, reportedBy, reportedAt, verifiedAt, artifacts, evidence, canonicalRepositories, notes, runId, reportingCycleId, attempt, workflow, instanceId]
      properties:
        id: { type: integer }
        decision: { type: string, enum: [accepted, rejected, obsolete, inconclusive] }
        confidence: { type: string, enum: [conclusive, inconclusive] }
        reason: { type: string }
        reportedBy: { type: string }
        reportedAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time, nullable: true }
        artifacts: { type: array, items: { $ref: '#/components/schemas/OutcomeArtifact' } }
        evidence: { type: array, items: { $ref: '#/components/schemas/OutcomeEvidence' } }
        canonicalRepositories: { type: array, items: { type: string } }
        notes: { type: string, nullable: true }
        runId: { type: string, nullable: true }
        reportingCycleId: { type: integer, nullable: true }
        attempt: { type: integer, nullable: true }
        workflow: { type: string, nullable: true }
        instanceId: { type: string, nullable: true }
      additionalProperties: false

    OutcomeArtifact:
      type: object
      required: [type]
      properties:
        type: { type: string }
        id: { type: string, nullable: true }
        url: { type: string, nullable: true }
        supersedes: { type: array, items: { type: string } }
      additionalProperties: true

    OutcomeEvidence:
      type: object
      required: [source, reference, resolution, disposition, reason]
      properties:
        source: { type: string }
        reference: { type: string }
        resolution: { type: string, enum: [accepted, rejected, unknown] }
        disposition: { type: string }
        reason: { type: string }
        kind:
          type: string
          enum: [state, comment]
          default: state
          description: >-
            Evidence category: state for provider/workflow facts, comment for authored commentary.
            Omitted kind defaults to state for compatibility; callers must set comment for comments.
        authorType:
          type: string
          enum: [human, workflow, agent, automation]
          nullable: true
          description: >-
            Author category, used only for comment evidence: agent/automation comments are ignored;
            human/workflow comments are authoritative. Missing authorType remains authoritative for compatibility.
            State evidence is valid regardless of authorType.
      additionalProperties: false

    TaskOutcomeTask:
      type: object
      required: [taskId, externalKey, sourceType, sourceUrl, lifecycle, state, category, repo, canonicalRepositories, title, summary, outcome, artifacts, evidence, timestamps]
      properties:
        taskId: { type: integer }
        externalKey: { type: string }
        sourceType: { type: string }
        sourceUrl: { type: string, nullable: true }
        lifecycle:
          type: object
          required: [status, createdAt, lastAddressed, archivedAt]
          properties:
            status: { type: string }
            createdAt: { type: string, format: date-time }
            lastAddressed: { type: string, format: date-time }
            archivedAt: { type: string, format: date-time, nullable: true }
          additionalProperties: false
        state: { type: string, enum: [accepted, rejected, obsolete, inconclusive, unreported, wip] }
        category:
          type: string
          enum: [delivery, monitoring, grooming]
          description: >-
            Work category. Monitoring is watch-duty work; grooming is ticket assessment/preparation.
            Both are shown separately and excluded from delivery acceptance rate and outcome coverage.
        repo: { type: string, nullable: true }
        canonicalRepositories: { type: array, items: { type: string } }
        title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        outcome:
          allOf:
            - $ref: '#/components/schemas/TaskOutcomeReport'
          nullable: true
        artifacts: { type: array, items: { $ref: '#/components/schemas/OutcomeArtifact' } }
        evidence: { type: array, items: { $ref: '#/components/schemas/OutcomeEvidence' } }
        timestamps:
          type: object
          required: [createdAt, lastAddressed, archivedAt, reportedAt, verifiedAt]
          properties:
            createdAt: { type: string, format: date-time }
            lastAddressed: { type: string, format: date-time }
            archivedAt: { type: string, format: date-time, nullable: true }
            reportedAt: { type: string, format: date-time, nullable: true }
            verifiedAt: { type: string, format: date-time, nullable: true }
          additionalProperties: false
        outcomeHistory: { type: array, items: { $ref: '#/components/schemas/TaskOutcomeReport' } }
        taskCycles: { type: array, items: { $ref: '#/components/schemas/TaskCycleReference' } }
      additionalProperties: false

    TaskCycleReference:
      type: object
      required: [id, cycleType, instanceId, startedAt, finishedAt]
      properties:
        id: { type: integer }
        cycleType: { type: string }
        instanceId: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
      additionalProperties: false

    TaskOutcomePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TaskOutcomeTask' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
      additionalProperties: false

    GroomingOutcomes:
      type: object
      description: Grooming-category states only; acceptance requires evidence, never task existence or done status alone.
      required: [acceptedCount, rejectedCount, obsoleteCount, inconclusiveCount, unreportedCount, wipCount]
      properties:
        acceptedCount: { type: integer, minimum: 0 }
        rejectedCount: { type: integer, minimum: 0 }
        obsoleteCount: { type: integer, minimum: 0 }
        inconclusiveCount: { type: integer, minimum: 0 }
        unreportedCount: { type: integer, minimum: 0 }
        wipCount: { type: integer, minimum: 0 }
      additionalProperties: false

    TaskOutcomeRepositorySummary:
      type: object
      required: [repo, acceptanceRate, outcomeCoverage, taskCount, deliveryTaskCount, monitoringCount, groomingCount, groomingOutcomes, acceptedCount, acceptedNoOpCount, rejectedCount, obsoleteCount, inconclusiveCount, unreportedCount, wipCount, reasons, providers]
      properties:
        repo: { type: string }
        acceptanceRate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Accepted / (accepted + rejected + obsolete) for delivery-category tasks; monitoring and grooming excluded.
        outcomeCoverage: { type: number, nullable: true, minimum: 0, maximum: 1 }
        taskCount: { type: integer, minimum: 0 }
        deliveryTaskCount: { type: integer, minimum: 0 }
        monitoringCount:
          type: integer
          minimum: 0
          description: Watch-duty task count. Excluded from acceptance rate and outcome coverage.
        groomingCount:
          type: integer
          minimum: 0
          description: Ticket assessment/preparation count. Excluded from delivery acceptance rate and outcome coverage.
        groomingOutcomes: { $ref: '#/components/schemas/GroomingOutcomes' }
        acceptedCount: { type: integer, minimum: 0 }
        acceptedNoOpCount: { type: integer, minimum: 0 }
        rejectedCount: { type: integer, minimum: 0 }
        obsoleteCount: { type: integer, minimum: 0 }
        inconclusiveCount: { type: integer, minimum: 0 }
        unreportedCount: { type: integer, minimum: 0 }
        wipCount: { type: integer, minimum: 0 }
        reasons: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        providers: { type: object, additionalProperties: { type: integer, minimum: 0 } }
      additionalProperties: false

    TaskOutcomeSummary:
      type: object
      required: [period, summary, repositories, metricDefinitions, freshness, backfill]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date, nullable: true }
          additionalProperties: false
        summary:
          type: object
          required: [acceptanceRate, outcomeCoverage, taskCount, deliveryTaskCount, monitoringCount, groomingCount, groomingOutcomes, repositoryCount, acceptedCount, acceptedNoOpCount, rejectedCount, obsoleteCount, inconclusiveCount, unreportedCount, wipCount]
          properties:
            acceptanceRate:
              type: number
              nullable: true
              minimum: 0
              maximum: 1
              description: Accepted / (accepted + rejected + obsolete) for delivery-category tasks; monitoring and grooming excluded.
            outcomeCoverage: { type: number, nullable: true, minimum: 0, maximum: 1 }
            taskCount: { type: integer, minimum: 0 }
            deliveryTaskCount: { type: integer, minimum: 0 }
            monitoringCount:
              type: integer
              minimum: 0
              description: Watch-duty task count. Excluded from acceptance rate and outcome coverage.
            groomingCount:
              type: integer
              minimum: 0
              description: Ticket assessment/preparation count. Excluded from delivery acceptance rate and outcome coverage.
            groomingOutcomes: { $ref: '#/components/schemas/GroomingOutcomes' }
            repositoryCount: { type: integer, minimum: 0 }
            acceptedCount: { type: integer, minimum: 0 }
            acceptedNoOpCount: { type: integer, minimum: 0 }
            rejectedCount: { type: integer, minimum: 0 }
            obsoleteCount: { type: integer, minimum: 0 }
            inconclusiveCount: { type: integer, minimum: 0 }
            unreportedCount: { type: integer, minimum: 0 }
            wipCount: { type: integer, minimum: 0 }
          additionalProperties: false
        repositories: { type: array, items: { $ref: '#/components/schemas/TaskOutcomeRepositorySummary' } }
        metricDefinitions:
          type: object
          required: [acceptanceRate, outcomeCoverage, monitoring, grooming]
          properties:
            acceptanceRate: { type: string }
            outcomeCoverage: { type: string }
            monitoring: { type: string }
            grooming: { type: string }
          additionalProperties: false
        freshness:
          type: object
          required: [generatedAt]
          properties:
            generatedAt: { type: string, format: date-time }
          additionalProperties: false
        backfill:
          type: object
          required: [state, unknownCount]
          properties:
            state: { type: string, enum: [not_started, in_progress, complete, failed] }
            unknownCount: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false

    TaskItem:
      type: object
      required:
        - id
        - external_key
        - jira_key
        - source_type
        - artifacts
        - status
        - category
        - repo
        - branch
        - created_at
        - paused_reason
        - metadata
      properties:
        id: { type: integer }
        external_key: { type: string }
        jira_key: { type: string }
        source_type: { type: string }
        source_url: { type: string, nullable: true }
        artifacts:
          type: array
          items:
            type: object
            required: [name, url, type]
            properties:
              name: { type: string }
              url: { type: string }
              type: { type: string }
        status: { type: string }
        category:
          type: string
          enum: [delivery, monitoring, grooming]
          description: Monitoring watch-duty and grooming ticket assessment/preparation are excluded from delivery outcome metrics.
        repo: { type: string }
        branch: { type: string }
        title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        created_at: { type: string }
        last_addressed: { type: string, nullable: true }
        paused_reason: { type: string, nullable: true }
        instance_id: { type: string, nullable: true }
        metadata: { type: object }
