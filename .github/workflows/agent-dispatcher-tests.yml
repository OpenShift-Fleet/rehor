name: Agent Dispatcher Tests

on:
  pull_request:
    paths:
      - 'packages/agent-dispatcher/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/agent-dispatcher-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'packages/agent-dispatcher/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/agent-dispatcher-tests.yml'

permissions:
  contents: read

jobs:
  dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          NPM_AUTH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${NPM_AUTH_TOKEN:-}" ]; then
            echo "::error::GitHub Actions token is unavailable for @nvidia package installation."
            exit 1
          fi

          umask 077
          npmrc="$(mktemp "${RUNNER_TEMP}/dispatcher-npmrc.XXXXXX")"
          trap 'rm -f "$npmrc"' EXIT
          chmod 600 "$npmrc"

          cat > "$npmrc" <<EOF
          @nvidia:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NPM_AUTH_TOKEN}
          EOF
          unset NPM_AUTH_TOKEN

          npm ci --userconfig "$npmrc"

      - name: Run tests
        run: npm test --workspace=@rehor/agent-dispatcher
