site_name: Řehoř
site_description: Workflow-driven autonomous developer tool documentation
theme:
  name: material
  logo: assets/images/icon.png
  favicon: assets/images/favicon.png
  font:
    text: false
    code: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-2
        name: Dark theme
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Light theme
repo_url: https://github.com/RedHatInsights/platform-frontend-ai-dev
repo_name: RedHatInsights/platform-frontend-ai-dev

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Onboarding a New Instance: onboarding-new-instance.md
    - Instance Configuration: presets/instance-config.md
    - Scheduling: scheduling.md
  - Architecture:
    - Bot Workflow Loop: bot-workflow-loop.md
    - Debugging Cycles and Improving Agents: debugging-cycles-and-agents.md
    - Git Auth Proxy: git-auth-proxy.md
    - Preset System Design: presets-design.md
  - Presets:
    - Overview: presets/README.md
    - Workflow Presets: presets/workflows.md
    - Env Presets: presets/envs.md
    - Custom Workflows: presets/custom-workflows.md
    - Custom Preflight Scripts: presets/custom-preflight.md
  - Operations Runbooks:
    - Operations Overview: operations/index.md
    - Branch Protection Rollout: operations/rehor-77-branch-protection-rollout.md
    - Container Verification: operations/rehor-107-container-verification.md
    - Container E2E: operations/rehor-62-container-e2e.md
  - Migrations:
    - Preset Migration Guide: migrations/preset-migration-guide.md
    - OpenCode Migration Design: migrations/opencode-migration.md
  - Roadmap: roadmap.md
