name: Coordinator Tests

on:
  pull_request:
    paths:
      - 'coordinator/**'
      - '.github/workflows/coordinator-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'coordinator/**'
      - '.github/workflows/coordinator-tests.yml'

permissions:
  contents: read

jobs:
  coordinator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./coordinator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install Python bridge dependency
        run: python -m pip install pyyaml==6.0.3

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
