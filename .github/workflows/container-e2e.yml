name: Container E2E

# REHOR-62 bootstrap:
# - e2e-minimal runs on PRs and master pushes for container-relevant changes.
# - e2e-full-stack (node+go+container-scan) is manual while runtime/cost settles.
# - e2e-browser is manual because Chromium download/runtime is significantly
#   heavier and can be sensitive to runner disk headroom.
on:
  pull_request:
    paths:
      - "Dockerfile.runner"
      - "Makefile"
      - "entrypoint.sh"
      - "bot/**"
      - "proxy/**"
      - "memory-server/**"
      - "presets/**"
      - "tests/container-e2e/**"
      - ".github/workflows/container-e2e.yml"
  push:
    branches:
      - master
    paths:
      - "Dockerfile.runner"
      - "Makefile"
      - "entrypoint.sh"
      - "bot/**"
      - "proxy/**"
      - "memory-server/**"
      - "presets/**"
      - "tests/container-e2e/**"
      - ".github/workflows/container-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run container e2e (minimal fixture)
        run: |
          set -euo pipefail
          make --dry-run container-e2e
          bash tests/container-e2e/test-container.sh \
            --fixture minimal \
            --artifacts-dir "${RUNNER_TEMP}/container-e2e-minimal-logs"

      - name: Upload minimal fixture logs
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: container-e2e-minimal-logs
          path: ${{ runner.temp }}/container-e2e-minimal-logs
          if-no-files-found: warn

  e2e-full-stack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run container e2e (full-stack fixture)
        run: |
          set -euo pipefail
          bash tests/container-e2e/test-container.sh \
            --fixture full-stack \
            --artifacts-dir "${RUNNER_TEMP}/container-e2e-full-stack-logs"

      - name: Upload full-stack fixture logs
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: container-e2e-full-stack-logs
          path: ${{ runner.temp }}/container-e2e-full-stack-logs
          if-no-files-found: warn

  e2e-browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run container e2e (browser-only fixture)
        run: |
          set -euo pipefail
          bash tests/container-e2e/test-container.sh \
            --fixture browser-only \
            --artifacts-dir "${RUNNER_TEMP}/container-e2e-browser-logs"

      - name: Upload browser fixture logs
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: container-e2e-browser-logs
          path: ${{ runner.temp }}/container-e2e-browser-logs
          if-no-files-found: warn
