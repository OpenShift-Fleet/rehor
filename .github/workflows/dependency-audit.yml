name: Dependency audit

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'proxy/executor/go.mod'
      - 'proxy/executor/go.sum'
      - 'dashboard/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches:
      - master
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'proxy/executor/go.mod'
      - 'proxy/executor/go.sum'
      - 'dashboard/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '30 7 * * 1' # every monday 7:30 UTC

permissions:
  contents: read

# TODO(REHOR follow-up): switch go-audit and node-audit back to blocking
# once dependency remediation lands for Go/Node vulnerabilities.
jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv and deps
        run: |
          pip install uv
          uv sync --frozen --extra dev

      - name: Check lockfile drift
        run: uv lock --check

      - name: Run pip-audit
        run: |
          pip install pip-audit
          uv run pip-audit --strict --desc --local

  go-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy/executor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: proxy/executor/go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          govulncheck ./...
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::govulncheck reported vulnerabilities. report-only mode is enabled until dependency remediation is merged."
          fi

  node-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run npm audit
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit reported vulnerabilities. report-only mode is enabled until dependency remediation is merged."
          fi
