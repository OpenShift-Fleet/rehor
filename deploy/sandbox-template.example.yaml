apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rehor-sandbox
parameters:
- name: NAMESPACE
  required: true
- name: BOT_IMAGE
  required: true
- name: BOT_IMAGE_DIGEST
  required: true
- name: BOT_NAME
  value: devbot-sandbox
- name: BOT_LABEL
  required: true
- name: BOT_INSTANCE_ID
  required: true
- name: BOT_CONFIG_REPO
  required: true
- name: BOT_CONFIG_PATH
  required: true
- name: BOT_BOARD_NAME
  value: ""
- name: BOT_SPRINT_PREFIX
  value: ""
- name: BOT_INCLUDE_BACKLOG
  value: "false"
- name: BOT_REPLICAS
  value: "0"
- name: SLACK_WEBHOOK_URL
  value: ""
- name: GCP_PROJECT_ID
  required: true
- name: GCP_REGION
  required: true
- name: VERTEX_ALLOWED_MODELS
  required: true
- name: KEDA_TIMEZONE
  value: Europe/Prague
- name: KEDA_CRON_START
  value: "0 9 * * 1-5"
- name: KEDA_CRON_END
  value: "0 23 * * 1-5"
objects:

# OpenShell SandboxTemplate + SandboxWarmPool replace the bot Deployment. The
# OpenShell gateway and agent-sandbox controller must already be installed.
# Shared proxy, memory-server, and devbot-secrets come from deploy/template.yaml.
- apiVersion: extensions.agents.x-k8s.io/v1beta1
  kind: SandboxTemplate
  metadata:
    name: ${BOT_NAME}
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  spec:
    networkPolicyManagement: Managed
    networkPolicy:
      ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-sandbox-system
          podSelector:
            matchLabels:
              app: sandbox-router
      egress:
      - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devbot-proxy
        ports:
        - port: 3128
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 8444
          protocol: TCP
        - port: 8446
          protocol: TCP
        - port: 8447
          protocol: TCP
        - port: 8448
          protocol: TCP
        - port: 9090
          protocol: TCP
      - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memory-server
        ports:
        - port: 8080
          protocol: TCP
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
        ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: ${BOT_NAME}
          app.kubernetes.io/component: bot
          app.kubernetes.io/part-of: devbot
      spec:
        containers:
        - name: bot
          image: ${BOT_IMAGE}@${BOT_IMAGE_DIGEST}
          imagePullPolicy: IfNotPresent
          env:
          - name: BOT_LABEL
            value: ${BOT_LABEL}
          - name: BOT_MEMORY_URL
            value: http://devbot-memory-server:8080/mcp
          - name: BOT_MEMORY_HEALTH_URL
            value: http://devbot-memory-server:8080/health
          - name: BOT_MEMORY_HEALTH_TIMEOUT
            value: "120"
          - name: CLAUDE_CODE_SKIP_VERTEX_AUTH
            value: "true"
          - name: ANTHROPIC_VERTEX_BASE_URL
            value: http://devbot-proxy:8443
          - name: ANTHROPIC_VERTEX_PROJECT_ID
            value: dummy-project
          - name: CLOUD_ML_REGION
            value: ${GCP_REGION}
          - name: EXECUTOR_ADDR
            value: devbot-proxy:9090
          - name: HUSKY
            value: "0"
          - name: GH_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gh-username
          - name: GH_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-email
          - name: GL_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-name
          - name: GL_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-email
          - name: BOT_JIRA_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: jira-email
          - name: BOT_BOARD_NAME
            value: ${BOT_BOARD_NAME}
          - name: BOT_SPRINT_PREFIX
            value: ${BOT_SPRINT_PREFIX}
          - name: BOT_INCLUDE_BACKLOG
            value: ${BOT_INCLUDE_BACKLOG}
          - name: BOT_INSTANCE_ID
            value: ${BOT_INSTANCE_ID}
          - name: BOT_CONFIG_REPO
            value: ${BOT_CONFIG_REPO}
          - name: BOT_CONFIG_PATH
            value: ${BOT_CONFIG_PATH}
          - name: BOT_DASHBOARD_URL
            value: http://devbot-memory-server:8080/api/bot-status
          - name: COSTS_API_URL
            value: http://devbot-memory-server:8080/api/costs
          - name: SLACK_WEBHOOK_URL
            value: ${SLACK_WEBHOOK_URL}
          - name: PROXY_HOST
            value: devbot-proxy
          - name: HTTP_PROXY
            value: http://devbot-proxy:3128
          - name: HTTPS_PROXY
            value: http://devbot-proxy:3128
          - name: http_proxy
            value: http://devbot-proxy:3128
          - name: https_proxy
            value: http://devbot-proxy:3128
          - name: NO_PROXY
            value: devbot-memory-server,devbot-proxy,localhost,127.0.0.1
          - name: no_proxy
            value: devbot-memory-server,devbot-proxy,localhost,127.0.0.1
          - name: JIRA_MCP_URL
            value: http://devbot-proxy:8444/mcp
          - name: GH_RELEASE_UPLOAD_URL
            value: http://devbot-proxy:8446/upload
          - name: GCP_PROJECT_ID
            value: ${GCP_PROJECT_ID}
          - name: VERTEX_ALLOWED_MODELS
            value: ${VERTEX_ALLOWED_MODELS}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: repos
            mountPath: /home/botuser/repos
          - name: data
            mountPath: /home/botuser/data
        volumes:
        - name: tmp
          emptyDir: {}
        - name: repos
          emptyDir: {}
        - name: data
          emptyDir: {}

# KEDA scales the warm pool, not a Deployment. One replica = one running bot.
- apiVersion: extensions.agents.x-k8s.io/v1beta1
  kind: SandboxWarmPool
  metadata:
    name: ${BOT_NAME}
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  spec:
    replicas: ${{BOT_REPLICAS}}
    sandboxTemplateRef:
      name: ${BOT_NAME}

# KEDA cron schedule. Replace with multiple triggers when supporting several
# working-hour windows or time zones.
- apiVersion: keda.sh/v1alpha1
  kind: ScaledObject
  metadata:
    name: ${BOT_NAME}-cron-scaler
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/part-of: devbot
  spec:
    scaleTargetRef:
      apiVersion: extensions.agents.x-k8s.io/v1beta1
      kind: SandboxWarmPool
      name: ${BOT_NAME}
    minReplicaCount: 0
    maxReplicaCount: 1
    triggers:
    - type: cron
      metadata:
        timezone: ${KEDA_TIMEZONE}
        start: ${KEDA_CRON_START}
        end: ${KEDA_CRON_END}
        desiredReplicas: "1"
