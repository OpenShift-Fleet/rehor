site_name: Řehoř
site_description: Workflow-driven autonomous developer tool documentation
site_url: https://openshift-fleet.github.io/rehor/
theme:
  name: material
  logo: assets/images/icon.png
  favicon: assets/images/favicon.png
  font:
    text: false
    code: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-2
        name: Dark theme
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Light theme
repo_url: https://github.com/OpenShift-Fleet/rehor
repo_name: OpenShift-Fleet/rehor

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Agent Dispatcher Deployment: agent-dispatcher-deployment.md
    - Instance Configuration: presets/instance-config.md
    - Onboarding a New Instance: onboarding-new-instance.md
    - OpenShell Deployment: openshell-deployment.md
  - Architecture:
    - Bot Workflow Loop: bot-workflow-loop.md
    - Scheduling: scheduling.md
    - Model Configuration: models.md
    - Debugging Cycles and Improving Agents: debugging-cycles-and-agents.md
    - Git Auth Proxy: git-auth-proxy.md
    - Agent Proxy Gateway: agent-proxy-gateways.md
    - Dispatcher Credentials and Secrets: dispatcher-secrets.md
  - Presets:
    - Overview: presets/README.md
    - Workflow Presets: presets/workflows.md
    - Env Presets: presets/envs.md
    - Custom Workflows: presets/custom-workflows.md
    - Dispatcher Preflights: presets/custom-preflight.md
    - Preflight Reference: presets/preflight-reference.md
  - Operations Runbooks:
    - Operations Overview: operations/index.md
    - Dashboard Global Search: global-search.md
    - Branch Protection Rollout: operations/rehor-77-branch-protection-rollout.md
    - Container Verification: operations/rehor-107-container-verification.md
    - Container E2E: operations/rehor-62-container-e2e.md
  - Roadmap: roadmap.md

not_in_nav: |
  /legacy/
  /migrations/
  /presets-design.md
  /scheduling.md
